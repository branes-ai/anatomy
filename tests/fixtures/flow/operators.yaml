# The test mission's operator registry: one operator per composite, and two
# operators of their own, for a body of several operators and a research graph.
operators:
  TestEstimator:    { header: test/estimator.hpp, type: test::TestEstimator, composite: estimator }
  NullMonitor:      { header: test/monitor.hpp, type: test::NullMonitor, composite: monitor }
  PassController:   { header: test/controller.hpp, type: test::PassController, composite: controller }
  NullSafetyFilter: { header: test/safety_filter.hpp, type: test::NullSafetyFilter, composite: safety_filter }
  Gain:
    header: test/gain.hpp
    type: test::Gain
    signature: test::flow::gain_signature
    binding: test::flow::GainBinding
    handlers:
      apply: { in: [estimate, limits], out: [setpoint] }
  Track:
    header: test/track.hpp
    type: test::Track
    signature: test::flow::track_signature
    binding: test::flow::TrackBinding
    handlers:
      step: { in: [estimate, setpoint, alerts, marks], out: [command] }
